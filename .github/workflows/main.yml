name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
env:
  APP_ID: ir.mench.game
  APP_NAME: LUDORA
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create signing key (first run only)
        run: |
          if [ ! -f release.jks ]; then
            openssl rand -hex 12 > signing-pass.txt
            keytool -genkeypair -keystore release.jks -alias mench -keyalg RSA -keysize 2048 -validity 10000 -storepass "$(cat signing-pass.txt)" -keypass "$(cat signing-pass.txt)" -dname "CN=Mench, O=Mench, C=IR"
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add release.jks signing-pass.txt
            git commit -m "Add signing key"
            git push
          fi

      - name: Prepare project
        run: |
          mkdir -p www
          cp "$(ls index*.html | head -1)" www/index.html
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/app@8
          npx cap init "$APP_NAME" "$APP_ID" --web-dir www
          npx cap add android
          npx cap sync android
          sed -i -E "s/versionCode[ =]+[0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: App icon
        continue-on-error: true
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          BG = (245, 242, 235)
          COLS = [(226, 87, 76), (63, 120, 216), (242, 182, 50), (47, 163, 107)]
          def art(size, kind):
              k = 4
              S = size * k
              im = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              if kind == "square":
                  d.rounded_rectangle([0, 0, S - 1, S - 1], radius=S * 0.22, fill=BG + (255,))
              elif kind == "round":
                  d.ellipse([0, 0, S - 1, S - 1], fill=BG + (255,))
              sc = 0.74 if kind == "fg" else 1.0
              c = S / 2
              r = S * sc * 0.19
              off = S * sc * 0.22
              for (dx, dy), col in zip([(-1, -1), (1, -1), (1, 1), (-1, 1)], COLS):
                  x, y = c + dx * off, c + dy * off
                  d.ellipse([x - r, y - r, x + r, y + r], fill=col + (255,), outline=(255, 255, 255, 255), width=int(S * 0.012))
              rr = S * sc * 0.07
              d.ellipse([c - rr, c - rr, c + rr, c + rr], fill=(38, 36, 31, 255))
              return im.resize((size, size), Image.LANCZOS)
          res = "android/app/src/main/res"
          for dpi, leg, fg in [("mdpi", 48, 108), ("hdpi", 72, 162), ("xhdpi", 96, 216), ("xxhdpi", 144, 324), ("xxxhdpi", 192, 432)]:
              dd = f"{res}/mipmap-{dpi}"
              os.makedirs(dd, exist_ok=True)
              art(leg, "square").save(f"{dd}/ic_launcher.png")
              art(leg, "round").save(f"{dd}/ic_launcher_round.png")
              art(fg, "fg").save(f"{dd}/ic_launcher_foreground.png")
          os.makedirs(f"{res}/values", exist_ok=True)
          open(f"{res}/values/ic_launcher_background.xml", "w").write('<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#F5F2EB</color></resources>')
          PY

      - name: Build signed APK
        run: |
          cd android
          ./gradlew assembleRelease
          PASS="$(cat ../signing-pass.txt)"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks ../release.jks --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --ks-key-alias mench --out "$RUNNER_TEMP/mench.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "$RUNNER_TEMP/mench.apk"
          mkdir -p ../out
          cp "$RUNNER_TEMP/mench.apk" ../out/mench.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mench-release-apk
          path: out/mench.apk
